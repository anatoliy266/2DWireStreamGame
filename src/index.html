<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DPI // HUD OVERLAY</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="game-overlay">
        <div id="top-bar">
            <div>[ NETWORK_TRACE: IN_PROGRESS ]</div>
            <div id="hops-display"></div>
            <div id="turn-timer">FLUSHING: 15S</div>
        </div>

        <div id="main-stage">
            <!-- LEFT: ENEMY NODES -->
            <div id="enemies-panel">
                <div class="panel-label">DETECTED_THREATS</div>
                <div id="enemy-list"></div>
            </div>

            <!-- CENTER: THE SMART ENGINE (BUFFER) -->
            <div id="buffer-panel">
                <div class="panel-label" style="text-align: center;">CENTRAL_BUFFER_ORCHESTRATOR</div>
                <div id="attack-slots"></div>
                <div style="height: 1px; background: var(--term-dim); margin: 5px 0;"></div>
                <div id="defense-slots"></div>
            </div>

            <!-- RIGHT: RAID NODES -->
            <div id="raid-panel">
                <div class="panel-label">ACTIVE_NODES</div>
                <div id="player-list"></div>
            </div>
        </div>

        <div id="system-log"></div>
    </div>
    <script src="main.ts" defer></script>
</body>

</html>
